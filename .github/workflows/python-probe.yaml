name: python-probe

# Runs a Python reference probe in tools/ (for example the SciPy and HiGHS
# probe) and uploads its output. macOS on arm64 is the reference platform.
# A push to a pyprobe/** branch runs the defaults below.

on:
  push:
    branches: ["pyprobe/**"]
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe script, relative to the repository root"
        required: true
        default: tools/highs-probe.py
      packages:
        description: "pip requirements, separated by spaces"
        required: false
        default: "scipy==1.18.1 numpy"

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run the probe
        shell: bash
        env:
          PROBE: ${{ inputs.probe || 'tools/highs-probe.py' }}
          PACKAGES: ${{ inputs.packages || 'scipy==1.18.1 numpy' }}
        run: |
          case "$PROBE" in
            tools/*.py) ;;
            *) echo "the probe must be a tools/*.py script"; exit 1 ;;
          esac
          python3 -m pip install $PACKAGES
          mkdir -p probe-out
          python3 "$PROBE" > probe-out/probe.txt 2> probe-out/probe.err || {
            tail -50 probe-out/probe.err; exit 1; }
          wc -l probe-out/probe.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe-output
          path: probe-out/
